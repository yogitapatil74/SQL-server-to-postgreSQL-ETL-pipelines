name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      POSTGRESQL_HOSTNAME: localhost
      POSTGRESQL_PORT: "5432"
      POSTGRES_DB_NAME: postgres
      POSTGRES_DB_USERNAME: postgres
      POSTGRES_DB_PASSWORD: postgres
      DB_ROLE: etl_user
      DB_ROLE_PASSWORD: "ci-pass'with-quote"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest

      - name: Validate mapping and SQL scripts (no database changes)
        run: python src/main.py --database aw_sales --validate-only

      - name: Integration test against PostgreSQL
        env:
          ETL_PG_INTEGRATION: "1"
        run: pytest tests/integration
